<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        // GitHub Pages에서 SPA 라우팅을 위한 리다이렉트
        const path = window.location.pathname;
        
        // 정적 파일이 아닌 경우 루트로 리다이렉트
        if (path !== '/' && 
            !path.includes('.') && 
            !path.includes('_nuxt') &&
            !path.includes('assets')) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
