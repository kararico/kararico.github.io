<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Page Not Found</title>
    <script type="text/javascript">
      // 정적 파일 요청은 리다이렉트하지 않음
      if (!location.pathname.match(/\.[a-zA-Z0-9]+$/)) {
        location.replace('/kararico.github.io/' + '#' + location.pathname + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <h1>Page Not Found</h1>
  </body>
</html>
