<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        // GitHub Pages에서 SPA 라우팅을 위한 리다이렉트
        const path = window.location.pathname;
        const search = window.location.search;
        const hash = window.location.hash;
        
        // 현재 경로가 루트가 아니고 .html, .css, .js, .png, .jpg, .jpeg, .gif, .svg, .ico, .woff, .woff2, .ttf, .eot 파일이 아닌 경우
        if (path !== '/' && 
            !path.includes('.html') && 
            !path.includes('.css') && 
            !path.includes('.js') && 
            !path.includes('.png') && 
            !path.includes('.jpg') && 
            !path.includes('.jpeg') && 
            !path.includes('.gif') && 
            !path.includes('.svg') && 
            !path.includes('.ico') && 
            !path.includes('.woff') && 
            !path.includes('.woff2') && 
            !path.includes('.ttf') && 
            !path.includes('.eot') &&
            !path.includes('_nuxt') &&
            !path.includes('assets')) {
            
            // 루트로 리다이렉트하고 해시로 경로 전달
            window.location.href = '/' + hash + '?redirect=' + encodeURIComponent(path + search);
        } else {
            // 루트로 리다이렉트
            window.location.href = '/';
        }
    </script>
</body>
</html>
