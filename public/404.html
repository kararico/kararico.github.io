<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // GitHub Pages SPA 라우팅을 위한 404.html
        // 모든 404 요청을 메인 앱으로 리다이렉트
        const baseURL = '/kararico.github.io/';
        const currentPath = window.location.pathname + window.location.search + window.location.hash;
        
        // 현재 경로에서 baseURL을 제거하고 실제 라우트 경로만 추출
        let routePath = currentPath;
        if (currentPath.startsWith(baseURL)) {
            routePath = currentPath.substring(baseURL.length - 1);
        }
        
        // 메인 앱으로 리다이렉트하면서 라우트 정보를 hash로 전달
        window.location.href = baseURL + '#' + routePath;
    </script>
</head>
<body>
    <p>Redirecting to application...</p>
</body>
</html>
