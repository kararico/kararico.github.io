<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // 즉시 실행되는 리다이렉트
        (function() {
            const path = window.location.pathname;
            
            // 정적 파일이 아닌 경우 루트로 리다이렉트
            if (path !== '/' && 
                !path.includes('.') && 
                !path.includes('_nuxt') &&
                !path.includes('assets')) {
                window.location.replace('/');
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
